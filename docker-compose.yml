services:
  mnemosyne:
    build:
      context: .
      dockerfile: Dockerfile
    # ports:
    #   - "8090:8090"
    volumes:
      - ${MNEMOSYNE_DB_PATH:-./db}:/data
    environment:
      - MNEMOSYNE_DATA_DIR=/data
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mnemosyne-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    # ports:
    #   - "8765:8765"
    volumes:
      - ${MNEMOSYNE_DB_PATH:-./db}:/data   # mismo volume → ve el mismo SQLite
    environment:
      - MNEMOSYNE_DASHBOARD_DB=/data/mnemosyne.db
      - MNEMOSYNE_DASHBOARD_HOST=0.0.0.0
      - MNEMOSYNE_DASHBOARD_PORT=8765
    depends_on:
      - mnemosyne
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
